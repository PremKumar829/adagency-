<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Ads Agency - Redirecting</title>
    <script>
      // Single Page App redirect for GitHub Pages custom domains
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        if (path.indexOf('/admin') !== -1) {
          window.location.replace('/#admin');
        } else {
          window.location.replace('/' + (hash || ''));
        }
      })();
    </script>
  </head>
  <body style="background-color: #080C14; color: #E2E8F0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2>Loading Prime Ads Agency...</h2>
      <p style="color: #94A3B8;">Redirecting to Admin Panel...</p>
    </div>
  </body>
</html>
